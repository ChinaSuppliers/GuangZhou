<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>China Suppliers</title>
    <meta name="google-site-verification" content="1cpEAwSvcS5YBRS6lLN8BQgiCR68geXiLVi6-BhRXnw" />
    <link rel="icon" href="./favicon.png" type="image/x-icon">

    <meta
        name="description"
        content="China Suppliers. Sourcing, IT, manufacturers, factories, wholesale, OEM and ODM. Helping global buyers source from China."
    >

    <meta
        name="keywords"
        content="China Suppliers, Chinese Suppliers, China Sourcing, China Manufacturers, China Factories, Wholesale, OEM, ODM"
    >

    <meta name="author" content="ChinaSuppliers">

    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#f5f7fa">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="China Suppliers">
    <meta
        property="og:description"
        content="Sourcing · IT · Manufacturers · Factories · Wholesale · OEM · ODM"
    >
    <meta property="og:url" content="https://chinasuppliers.github.io/ChinaSuppliers/">

    <style>
        :root {
            --bg-start: #f8fafc;
            --bg-end: #eef2f7;

            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.9);

            --text-main: #111827;
            --text-secondary: #667085;
            --text-muted: #98a2b3;

            --button-bg: rgba(255, 255, 255, 0.8);
            --button-border: rgba(17, 24, 39, 0.08);
            --button-hover: rgba(255, 255, 255, 1);

            --shadow:
                0 25px 70px rgba(15, 23, 42, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(24px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: var(--text-main);

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255, 255, 255, 0.95),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    var(--bg-start),
                    var(--bg-end)
                );

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .card {
            position: relative;

            width: 100%;
            max-width: 520px;

            padding: 42px 32px 30px;

            text-align: center;

            background: var(--card-bg);

            border: 1px solid var(--card-border);

            border-radius: 28px;

            box-shadow: var(--shadow);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation: card-in 0.7s ease both;
        }

        .avatar {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 76px;
            height: 76px;

            margin-bottom: 20px;

            font-size: 43px;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid rgba(255, 255, 255, 1);

            border-radius: 50%;

            box-shadow:
                0 12px 30px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0;

            font-size: clamp(30px, 7vw, 42px);

            font-weight: 700;

            letter-spacing: -1.4px;

            line-height: 1.15;
        }

        .services {
            margin-top: 17px;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.8;

            letter-spacing: 0.2px;

            color: #475467;
        }

        .intro {
            max-width: 410px;

            margin: 20px auto 26px;

            font-size: 16px;

            line-height: 1.7;

            color: var(--text-secondary);
        }

        .links {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .link {
            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 50px;

            padding: 12px 18px;

            font-size: 14px;

            font-weight: 600;

            color: #344054;

            background: var(--button-bg);

            border: 1px solid var(--button-border);

            border-radius: 14px;

            box-shadow:
                0 4px 12px rgba(15, 23, 42, 0.025);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .link:hover {
            background: var(--button-hover);

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(15, 23, 42, 0.08);
        }

        .link:active {
            transform: translateY(0);
        }

        .link-icon {
            margin-right: 8px;

            font-size: 17px;
        }

        .official {
            margin-top: 20px;

            font-size: 14px;

            color: var(--text-secondary);
        }

        .official a {
            font-weight: 700;

            color: var(--text-main);

            border-bottom: 1px solid rgba(17, 24, 39, 0.25);

            transition: border-color 0.2s ease;
        }

        .official a:hover {
            border-color: var(--text-main);
        }

        .copyright {
            margin-top: 27px;

            font-size: 12px;

            letter-spacing: 0.2px;

            color: var(--text-muted);
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 34px 20px 25px;

                border-radius: 24px;
            }

            .avatar {
                width: 68px;
                height: 68px;

                font-size: 38px;
            }

            .services {
                font-size: 13px;
            }

            .intro {
                font-size: 15px;

                margin-top: 17px;
            }

            .link {
                min-height: 48px;

                font-size: 13.5px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
            }

            .link {
                transition: none;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-start: #0f172a;
                --bg-end: #020617;

                --card-bg: rgba(15, 23, 42, 0.68);
                --card-border: rgba(255, 255, 255, 0.08);

                --text-main: #f8fafc;
                --text-secondary: #aab4c3;
                --text-muted: #667085;

                --button-bg: rgba(255, 255, 255, 0.045);
                --button-border: rgba(255, 255, 255, 0.08);
                --button-hover: rgba(255, 255, 255, 0.09);

                --shadow:
                    0 25px 70px rgba(0, 0, 0, 0.35);
            }

            .avatar {
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.1);
            }

            .services {
                color: #c0c9d5;
            }

            .link {
                color: #d0d5dd;
            }

            .official a {
                color: #f8fafc;
                border-color: rgba(255, 255, 255, 0.25);
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="avatar" aria-hidden="true">
            👨🏻
        </div>

        <h1>
            GuangZhou · China Suppliers
        </h1>

        <div class="services">
            Sourcing · IT · Manufacturers · Factories · Wholesale · OEM · ODM
        </div>

        <p class="intro">
            Helping global buyers source from China.
        </p>

        <nav class="links" aria-label="Business services">

            <a
                class="link"
                href="https://chinalocalsupport.github.io/china-business-assistance/"
                target="_blank"
                rel="noopener"
            >
                <span class="link-icon">🌐</span>
                China Business Assistance
            </a>

            <a
                class="link"
                href="https://chinalocalsupport.github.io/china-business-trade-agent/"
                target="_blank"
                rel="noopener"
            >
                <span class="link-icon">🤝</span>
                China Business Trade Agent
            </a>

            <a
                class="link"
                href="https://chinalocalsupport.github.io/china-business-problems/"
                target="_blank"
                rel="noopener"
            >
                <span class="link-icon">🔎</span>
                China Supplier &amp; Business Support
            </a>

        </nav>

        <div class="official">

            <strong>China Suppliers</strong>
            ·
            <a
                href="https://visaservice.icu/"
                target="_blank"
                rel="noopener"
            >
                Friendly Link
            </a>
        </div>

        <div class="copyright">
            © 2026 · China Suppliers
        </div>

    </main>

</body>
</html>
